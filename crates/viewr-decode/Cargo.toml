[package]
name = "viewr-decode"
description = "Isolated decode worker for C-backed image formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "viewr-decode"
path = "src/main.rs"

[features]
default = []
# Opt-in C/C++ decoder backends. Off by default so the workspace builds on CI
# without system libraries. Enable for local/dev builds that have the deps:
#   cargo build -p viewr-decode --features avif,heic
avif = ["dep:libavif-image", "dep:image"]
heic = ["dep:libheif-rs"]
raw = ["dep:libraw-rs"]
all-c = ["avif", "heic", "raw"]

[dependencies]
viewr-protocol = { path = "../viewr-protocol" }
image = { version = "0.25", optional = true, default-features = false }
libavif-image = { version = "0.14", optional = true }
# Ubuntu 24.04, the pinned Linux C-decoder validation host, provides libheif
# 1.17. Keep the wrapper's declared API floor aligned with the APIs used here
# instead of its newer default `latest` feature.
libheif-rs = {
    version = "2.7",
    optional = true,
    default-features = false,
    features = ["v1_17"],
}
libraw-rs = { version = "0.0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
viewr-seccomp = { path = "../viewr-seccomp" }

[lints]
workspace = true
