# cargo-deny configuration. See docs/STANDARDS.md.
# The headline rules are in [bans]: remote-service client stacks are forbidden,
# and Linux's generic D-Bus transport is confined to the AccessKit dependency path.
# Runtime and package boundaries independently deny Internet access.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Unmaintained (not a vulnerability), pulled transitively by winit's Linux
    # Wayland client-side-decoration crate (sctk-adwaita -> ab_glyph ->
    # ttf-parser). No safe upgrade exists yet. Tracked for removal when winit's
    # decoration path moves off ttf-parser. Not reachable on our untrusted-input
    # path and not a security issue.
    "RUSTSEC-2026-0192",

    # quick-xml DoS advisories (quadratic attribute check; unbounded namespace
    # allocation). Reviewed and not reachable in viewr: quick-xml is used only by
    # winit's `wayland-scanner`, a BUILD-TIME proc-macro that parses the fixed,
    # trusted Wayland protocol XML bundled with the crate. It never parses user,
    # file, or network input, does not run in the shipped app, and is Linux-only.
    # wayland-scanner pins quick-xml 0.39, so the fix (0.41) is not yet reachable.
    # Tracked for removal when winit/wayland-scanner update. Runtime-reachable
    # vulnerabilities are never ignored; see docs/STANDARDS.md.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # `paste` is unmaintained but has no known vulnerability or safe upgrade.
    # It is used by little_exif and image's EXR decoder, both of which remain
    # required for the documented format and metadata features. Reassess when
    # either dependency removes it; runtime vulnerabilities are never ignored.
    "RUSTSEC-2024-0436",

]

[licenses]
# Permissive licenses compatible with Apache-2.0 distribution.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # LLVM libFuzzer runtime, used only by the separate fuzz workspace.
    "NCSA",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    # Bundled default UI fonts from egui (`epaint_default_fonts`). Display-only;
    # not used on the image-decode path.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"
# The dependency half of the privacy invariant. HTTP clients/servers, websocket,
# QUIC, and TLS stacks fail the build. Linux accessibility requires upstream's
# generic D-Bus implementation, so zbus and its process helper may occur only
# behind the reviewed AccessKit/AT-SPI path; startup seccomp then permits only
# Unix-domain socket creation and denies io_uring before that adapter starts.
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "isahc" },
    { crate = "surf" },
    { crate = "attohttpc" },
    { crate = "awc" },
    { crate = "actix-web" },
    { crate = "axum" },
    { crate = "warp" },
    { crate = "tonic" },
    { crate = "quinn" },
    { crate = "tungstenite" },
    { crate = "tokio-tungstenite" },
    { crate = "rustls" },
    { crate = "native-tls" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "zbus", wrappers = ["accesskit_unix", "atspi-common", "atspi-proxies"], reason = "generic D-Bus transport is allowed only for Linux AccessKit/AT-SPI" },
    { crate = "async-process", wrappers = ["zbus"], reason = "process helper is allowed only inside the confined D-Bus transport" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
