[package]
name = "viewr"
description = "A photo viewer that just shows your photos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/blisspixel/viewr"
readme = "../../README.md"
categories = ["multimedia::images", "graphics"]
keywords = ["image", "photo", "viewer", "privacy", "gpu"]
default-run = "viewr"

[lib]
name = "viewr"
path = "src/lib.rs"

[[bin]]
name = "viewr"
path = "src/main.rs"

[dependencies]
# Trusted core only. See docs/STANDARDS.md dependency policy.
winit = "0.30"        # stable GA line; 0.31 is still beta
wgpu = "29"
pollster = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
rfd = "0.17.2"
jxl-oxide = { version = "0.12.6", features = ["image"] }
viewr-protocol = { path = "../viewr-protocol" }
egui = "0.35"
egui-winit = "0.35"
egui-wgpu = "0.35"
bytemuck = "1.25.2"
# Pure-Rust SVG rasterizer (STACK Decision 4 / Phase 6 vector support).
# Default features off: skip system fonts / text shaping so we do not pull
# unmaintained rustybuzz or OFL-licensed font blobs into the trusted core.
# Shapes, fills, and paths still render; text glyphs fall back to outlines when
# present as paths. Feature expansion for full SVG text is a deliberate later choice.
resvg = { version = "0.47", default-features = false, features = ["raster-images"] }
trash = { version = "5.2.6", default-features = false, features = ["coinit_apartmentthreaded"] }
little_exif = "0.6.23"

# Windows Job Object limits for the decode worker (kill-on-close with parent).
[target.'cfg(windows)'.dependencies]
accesskit_winit = { version = "0.32", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Unix worker address-space limit and Linux-specific seccomp hardening.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
viewr-seccomp = { path = "../viewr-seccomp" }

# Launch Services delivers Finder/Open With requests through the application
# delegate rather than argv. Keep this glue macOS-only and use the same objc2
# versions already selected by winit.
[target.'cfg(target_os = "macos")'.dependencies]
accesskit_winit = { version = "0.32", default-features = false, features = ["rwh_06"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSError",
    "NSFileManager",
    "NSObject",
    "NSURL",
] }

# Pure-Rust decoders for the always-on core formats. Exotic/C-backed formats
# (HEIC, RAW, AVIF) come later behind feature flags. See docs/STANDARDS.md.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "qoi", "hdr", "exr", "ff", "dds"]

[lints]
workspace = true

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
roxmltree = "0.21.1"
