<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>viewr UI mockup v2</title>
<style>
  :root {
    --ink: #0B0E14; --text: #E8EDF3; --rest: #B8C0CC; --muted: #8a94a3;
    --amber: #F7A845; --edge: rgba(255,255,255,.08);
    --pill: rgba(18,22,30,.72); --pill-edge: rgba(255,255,255,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--ink); color: var(--text); overflow: hidden; }
  .stage { position: relative; height: 100vh; width: 100vw; display: grid; place-items: center; }

  /* the photo is the hero: fills the frame, letterboxed against pure ink, no radius, no shadow */
  .photo {
    height: 100vh; width: auto; max-width: 100vw; aspect-ratio: 3/2;
    background:
      radial-gradient(58% 54% at 68% 26%, rgba(255,201,110,.9), rgba(247,146,47,.22) 42%, transparent 64%),
      linear-gradient(168deg, #2b3d63 0%, #16233d 46%, #0a1120 100%);
  }

  /* top bar */
  .topbar { position: absolute; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: linear-gradient(180deg, rgba(6,8,12,.5), transparent); }
  .brand { width: 21px; height: 21px; color: var(--text); }
  .file { font-size: 13.5px; font-weight: 550; }
  .spacer { flex: 1; }
  .counter { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--rest); cursor: pointer; }
  .ic:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .ic.danger:hover { background: rgba(247,120,120,.14); color: #ff9b9b; }
  .ic svg { width: 18px; height: 18px; }

  /* control pill: two groups, no delete */
  .pill { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px;
    padding: 5px; background: var(--pill); border: 1px solid var(--pill-edge); border-radius: 14px; backdrop-filter: blur(18px);
    box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .pbtn { height: 36px; width: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--rest); cursor: pointer; }
  .pbtn:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .pbtn:active { transform: scale(.94); }
  .pbtn svg { width: 18px; height: 18px; }
  .zoom { width: auto; padding: 0 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--amber); } /* amber: zoom != 100% is an active value */
  .sep { width: 1px; height: 20px; background: var(--pill-edge); margin: 0 5px; }
  /* demonstrate the focus-visible ring on one button */
  .pbtn.focused { outline: 2px solid var(--amber); outline-offset: 2px; color: var(--text); }

  /* delete + undo toast: neutral dot, amber only on Undo */
  .toast { position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: rgba(16,20,28,.9); border: 1px solid var(--pill-edge); border-radius: 12px; font-size: 13px;
    backdrop-filter: blur(18px); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .toast .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .toast a { color: var(--amber); font-weight: 600; cursor: pointer; text-decoration: none; }
  .toast .kbd { color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="photo"></div>

    <div class="topbar">
      <svg class="brand" viewBox="0 0 100 100" fill="none" stroke="currentColor">
        <polygon points="50,14 81,32 81,68 50,86 19,68 19,32" stroke-width="5"/>
        <polygon points="31,50 50,37 69,50 50,63" stroke-width="5"/>
        <circle cx="50" cy="50" r="5" fill="currentColor" stroke="none"/>
      </svg>
      <span class="file">autumn-ridge.jpg</span>
      <span class="spacer"></span>
      <span class="counter">7 / 214</span>
      <div class="ic" title="Info (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.4"/></svg></div>
      <div class="ic" title="Fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/></svg></div>
      <div class="ic danger" title="Delete to Trash (Del)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h18M8 6V4h8v2M18 6l-1 14H7L6 6"/></svg></div>
    </div>

    <div class="pill">
      <div class="pbtn" title="Previous (Left)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="pbtn" title="Next (Right)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 5l7 7-7 7"/></svg></div>
      <div class="sep"></div>
      <div class="pbtn zoom" title="Zoom (scroll)">137%</div>
      <div class="pbtn focused" title="Fit to window (Space)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M8 4H4v4M16 4h4v4M16 20h4v-4M8 20H4v-4"/></svg></div>
      <div class="pbtn" title="Crop (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg></div>
      <div class="pbtn" title="Save as (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></div>
    </div>

    <div class="toast">
      <span class="dot"></span>
      <span>autumn-ridge.jpg moved to Trash</span>
      <a>Undo</a><span class="kbd">Ctrl Z</span>
    </div>
  </div>
</body>
</html>
