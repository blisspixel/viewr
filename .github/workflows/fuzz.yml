name: Fuzz

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/viewr/**"
      - "crates/viewr-protocol/**"
      - "fuzz/**"
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/viewr/**"
      - "crates/viewr-protocol/**"
      - "fuzz/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FUZZ_TOOLCHAIN: nightly-2026-07-20
  # Pull requests stay fast. The weekly sweep runs longest, and the runs whose
  # result is allowed to reach a user get more than a pull request: a tag,
  # which is the release rerun, and a push to `main`. A reusable workflow keeps
  # the caller's `event_name`, so the release rerun is identified by its tag
  # ref rather than by `workflow_call`, which never appears here.
  FUZZ_SECONDS: >-
    ${{ github.event_name == 'schedule' && '600'
    || github.ref_type == 'tag' && '300'
    || github.event_name == 'push' && '180'
    || '60' }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: decode_memory
            max_len: 1048576
          - target: protocol_frames
            max_len: 1048592
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          cargo install cargo-fuzz --locked --version 0.13.2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target

      - name: Verify committed fuzz lockfile
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      - name: Format fuzz workspace
        run: cargo +$FUZZ_TOOLCHAIN fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: Lint fuzz workspace
        run: cargo +$FUZZ_TOOLCHAIN clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      # libFuzzer writes every newly interesting input into the corpus
      # directory, and without this that coverage is discarded when the job
      # ends: each run restarts from the committed seeds alone. Carrying the
      # corpus forward lets exploration compound across runs instead of
      # re-deriving the same reachable states every time. The key rotates per
      # run so each run publishes what it learned, and the prefix restores the
      # most recent corpus for this target. Restored entries carry libFuzzer's
      # content-hash names, so they never collide with the committed seeds and
      # both sets are present for the run.
      - name: Restore accumulated corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Build fuzz target
        run: cargo +$FUZZ_TOOLCHAIN fuzz build "${{ matrix.target }}"

      # A corpus that only grows would eventually spend the run's budget
      # loading inputs instead of exploring. The weekly sweep reduces it in
      # place to the smallest set reaching the same coverage, and that
      # minimized corpus is what later runs restore. Committed seeds removed as
      # redundant here return with the next checkout.
      - name: Minimize accumulated corpus
        if: github.event_name == 'schedule'
        run: >
          cargo +$FUZZ_TOOLCHAIN fuzz cmin "${{ matrix.target }}"
          "fuzz/corpus/${{ matrix.target }}"
          -- -max_len=${{ matrix.max_len }}

      - name: Fuzz
        run: >
          cargo +$FUZZ_TOOLCHAIN fuzz run "${{ matrix.target }}"
          "fuzz/corpus/${{ matrix.target }}" --
          -max_total_time=$FUZZ_SECONDS
          -timeout=30
          -rss_limit_mb=2048
          -max_len=${{ matrix.max_len }}
          -print_final_stats=1

      - name: Retain crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
