[package]
name = "viewr"
description = "A photo viewer that just shows your photos."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/blisspixel/viewr"
readme = "../../README.md"
categories = ["multimedia::images", "graphics"]
keywords = ["image", "photo", "viewer", "privacy", "gpu"]
default-run = "viewr"

[lib]
name = "viewr"
path = "src/lib.rs"

[[bin]]
name = "viewr"
path = "src/main.rs"

[dependencies]
# Trusted core only. See docs/STANDARDS.md dependency policy.
winit = "0.30"        # stable GA line; 0.31 is still beta
wgpu = "30"
pollster = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
# Direct use verifies that the locally patched decoder and viewr enforce one
# shared embedded-ICC ceiling during JPEG XL initialization and conversion.
jxl-color = "0.11.0"
viewr-protocol = { path = "../viewr-protocol" }
egui = "0.35"
egui-winit = "0.35"
egui-wgpu = "0.35"
bytemuck = "1.25.2"
# Pure-Rust SVG rasterizer (STACK Decision 4 / Phase 6 vector support).
# Default features off: skip system fonts / text shaping so we do not pull
# unmaintained rustybuzz or OFL-licensed font blobs into the trusted core.
# Shapes, fills, and paths still render; text glyphs fall back to outlines when
# present as paths. Feature expansion for full SVG text is a deliberate later choice.
resvg = { version = "0.47", default-features = false, features = ["raster-images"] }
trash = { version = "5.2.6", default-features = false, features = ["coinit_apartmentthreaded"] }
little_exif = "0.6.23"
same-file = "1.0.6"
# Save As is assembled beside the destination and persisted only after pixels
# and optional metadata are both complete.
tempfile = "3.27.0"
# The rating path parses only bounded JPEG XMP packets. Version 0.41 fixes the
# attribute and namespace denial-of-service advisories affecting earlier lines.
quick-xml = { version = "0.41.0", default-features = false }
# Pure-Rust bounded inspection of compressed PNG ICC metadata before image-rs
# materializes the profile.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# PNG chunk integrity is checked before opt-in EXIF metadata reaches the parser.
# The crate is already present through image-rs, but this is a direct use.
crc32fast = "1.5.0"
# Already used transitively by image-rs. Declared directly for bounded,
# pure-Rust embedded ICC conversion into the renderer's sRGB pipeline.
moxcms = "0.8.1"

# Windows Job Object limits for the decode worker (kill-on-close with parent).
[target.'cfg(windows)'.dependencies]
accesskit_winit = { version = "0.32", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# Unix worker address-space limit and Linux-specific seccomp hardening.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_winit = { version = "0.32", default-features = false, features = [
    "accesskit_unix",
    "async-io",
    "rwh_06",
] }
viewr-seccomp = { path = "../viewr-seccomp" }

# Launch Services delivers Finder/Open With requests through the application
# delegate rather than argv. Keep this glue macOS-only and use the same objc2
# versions already selected by winit.
[target.'cfg(target_os = "macos")'.dependencies]
accesskit_winit = { version = "0.32", default-features = false, features = ["rwh_06"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSError",
    "NSFileManager",
    "NSObject",
    "NSURL",
] }

# Pure-Rust decoders for the always-on core formats. Exotic/C-backed formats
# (HEIC, RAW, AVIF) come later behind feature flags. See docs/STANDARDS.md.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "qoi", "hdr", "exr", "ff", "dds"]

[lints]
workspace = true

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
roxmltree = "0.21.1"
