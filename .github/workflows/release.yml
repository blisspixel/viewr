name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  fuzz:
    uses: ./.github/workflows/fuzz.yml
    permissions:
      contents: read

  build:
    name: ${{ matrix.target }}
    needs: [quality, fuzz]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Set up pinned Rust target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}

      - name: Build locked release binaries
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}

      - name: Package and verify branch artifact
        if: github.ref_type != 'tag'
        run: >
          python scripts/release_artifact.py build
          --target ${{ matrix.target }}
          --binary-dir target/${{ matrix.target }}/release

      - name: Package and verify tag artifact
        if: github.ref_type == 'tag'
        env:
          VIEWR_RELEASE_TAG: ${{ github.ref_name }}
        run: >
          python scripts/release_artifact.py build
          --target ${{ matrix.target }}
          --binary-dir target/${{ matrix.target }}/release
          --expected-tag-from-env

      - name: Retain checksummed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewr-${{ matrix.target }}
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Publish verified GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every target artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: viewr-*
          path: target/release-publish
          merge-multiple: true

      - name: Verify the exact release asset set
        run: >
          python scripts/release_artifact.py verify-set
          target/release-publish
          --expected-tag "${{ github.ref_name }}"

      - name: Add immutable installer bootstrap assets
        shell: bash
        run: |
          set -euo pipefail
          cp install.ps1 target/release-publish/install.ps1
          cp install.sh target/release-publish/install.sh
          (
            cd target/release-publish
            sha256sum install.ps1 > install.ps1.sha256
            sha256sum install.sh > install.sh.sha256
          )

      - name: Attest every release asset
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: target/release-publish/*

      - name: Assemble draft and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag is not a supported semantic version: $tag" >&2
            exit 1
          fi
          notes_file="docs/releases/${tag}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Missing reviewed release notes: $notes_file" >&2
            exit 1
          fi

          version="${tag#v}"
          mapfile -t expected_names < <(printf '%s\n' \
            install.ps1 \
            install.ps1.sha256 \
            install.sh \
            install.sh.sha256 \
            "viewr-${version}-aarch64-apple-darwin.zip" \
            "viewr-${version}-aarch64-apple-darwin.zip.sha256" \
            "viewr-${version}-x86_64-apple-darwin.zip" \
            "viewr-${version}-x86_64-apple-darwin.zip.sha256" \
            "viewr-${version}-x86_64-pc-windows-msvc.zip" \
            "viewr-${version}-x86_64-pc-windows-msvc.zip.sha256" \
            "viewr-${version}-x86_64-unknown-linux-gnu.zip" \
            "viewr-${version}-x86_64-unknown-linux-gnu.zip.sha256" | sort)
          mapfile -t actual_names < <(find target/release-publish -maxdepth 1 -type f -printf '%f\n' | sort)
          if ! diff -u \
            <(printf '%s\n' "${expected_names[@]}") \
            <(printf '%s\n' "${actual_names[@]}"); then
            echo "Release assets do not match the exact expected set" >&2
            exit 1
          fi
          mapfile -t assets < <(find target/release-publish -maxdepth 1 -type f -print | sort)

          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to modify an already published release: $tag" >&2
              exit 1
            fi
            gh release edit "$tag" \
              --notes-file "$notes_file" \
              --title "viewr ${tag#v}"
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --notes-file "$notes_file" \
              --title "viewr ${tag#v}"
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --draft=false --latest
