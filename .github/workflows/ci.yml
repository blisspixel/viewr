name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt / clippy / test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      # Installs the exact toolchain and components pinned in rust-toolchain.toml.
      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Pedantic clippy with warnings as errors. This also enforces rustc lints
      # such as missing_docs and the unsafe_code = "forbid" from the workspace.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  coverage:
    name: coverage (>= 85% on logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      # Coverage is enforced on testable logic. Display/IPC glue (app, gpu, ui,
      # sandbox) and trivial entry points (error, main) need a display or the
      # external viewr-decode binary; they are driven by end-to-end checks, not
      # the line-coverage floor. See docs/STANDARDS.md.
      - name: Coverage
        run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex '(app|gpu|ui|sandbox|error|main)\.rs$'
          --fail-under-lines 85
          --lcov --output-path lcov.info

  supply-chain:
    name: deny + audit (privacy invariant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # cargo-deny enforces the network-crate ban that makes "viewr cannot phone
      # home" a checked fact, plus licenses and advisories.
      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit
