<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>viewr UI mockup v1</title>
<style>
  :root {
    --ink: #0B0E14; --ink-2: #10141d; --edge: rgba(255,255,255,.08);
    --text: #E8EDF3; --muted: #8a94a3; --amber: #F7A845;
    --pill: rgba(20,24,32,.72); --pill-edge: rgba(255,255,255,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--ink); color: var(--text); overflow: hidden;
  }
  .stage { position: relative; height: 100vh; width: 100vw; display: grid; place-items: center; }

  /* the "photo" placeholder: a synthetic landscape so the chrome has context */
  .photo {
    width: min(72vw, 1180px); aspect-ratio: 3/2; border-radius: 6px;
    background:
      radial-gradient(60% 55% at 70% 24%, rgba(255,201,110,.85), rgba(247,146,47,.25) 40%, transparent 62%),
      linear-gradient(165deg, #2a3a5e 0%, #16223c 48%, #0b1220 100%);
    box-shadow: 0 30px 90px rgba(0,0,0,.55);
  }

  /* top bar: filename + counter, auto-hide styling implied by softness */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; gap: 14px; padding: 0 18px;
    background: linear-gradient(180deg, rgba(6,8,12,.66), transparent);
  }
  .brand { width: 22px; height: 22px; color: var(--text); opacity: .9; }
  .file { font-size: 13.5px; font-weight: 550; letter-spacing: .01em; }
  .counter { font-size: 12.5px; color: var(--muted); }
  .spacer { flex: 1; }
  .top-actions { display: flex; gap: 4px; }
  .ic {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    color: var(--muted); cursor: pointer;
  }
  .ic:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .ic svg { width: 18px; height: 18px; }

  /* floating control pill, bottom center */
  .pill {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 6px;
    background: var(--pill); border: 1px solid var(--pill-edge);
    border-radius: 16px; backdrop-filter: blur(18px);
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .pbtn {
    height: 40px; min-width: 40px; padding: 0 10px; border-radius: 11px;
    display: grid; grid-auto-flow: column; place-items: center; gap: 7px;
    color: var(--text); cursor: pointer; font-size: 13px; font-weight: 550;
  }
  .pbtn:hover { background: rgba(255,255,255,.07); }
  .pbtn svg { width: 19px; height: 19px; }
  .pbtn.zoom { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sep { width: 1px; height: 22px; background: var(--pill-edge); margin: 0 4px; }
  .pbtn.danger:hover { background: rgba(247,120,120,.14); color: #ff9b9b; }

  /* delete + undo toast */
  .toast {
    position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 11px 14px 11px 16px;
    background: rgba(16,20,28,.9); border: 1px solid var(--pill-edge);
    border-radius: 12px; font-size: 13px; backdrop-filter: blur(18px);
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .toast .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .toast a { color: var(--amber); font-weight: 600; cursor: pointer; text-decoration: none; }

  .hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(138,148,163,.5); }
</style>
</head>
<body>
  <div class="stage">
    <div class="photo"></div>

    <div class="topbar">
      <svg class="brand" viewBox="0 0 100 100" fill="none" stroke="currentColor">
        <polygon points="50,14 81,32 81,68 50,86 19,68 19,32" stroke-width="5"/>
        <polygon points="31,50 50,37 69,50 50,63" stroke-width="5"/>
        <circle cx="50" cy="50" r="5" fill="currentColor" stroke="none"/>
      </svg>
      <span class="file">autumn-ridge.jpg</span>
      <span class="counter">7 / 214</span>
      <span class="spacer"></span>
      <div class="top-actions">
        <div class="ic" title="Info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg></div>
        <div class="ic" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/></svg></div>
      </div>
    </div>

    <div class="pill">
      <div class="pbtn" title="Previous (Left)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="pbtn" title="Next (Right)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></div>
      <div class="sep"></div>
      <div class="pbtn zoom" title="Zoom">100%</div>
      <div class="pbtn" title="Fit to window (Space)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4H4v4M16 4h4v4M16 20h4v-4M8 20H4v-4"/></svg></div>
      <div class="sep"></div>
      <div class="pbtn" title="Crop (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg></div>
      <div class="pbtn" title="Save as (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></div>
      <div class="sep"></div>
      <div class="pbtn danger" title="Delete (Del)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div>
    </div>

    <div class="toast">
      <span class="dot"></span>
      <span>Moved to Trash</span>
      <a>Undo</a>
    </div>

    <div class="hint">move the mouse away and all chrome fades — just the photo</div>
  </div>
</body>
</html>
