name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    if: github.event_name != 'schedule'
    name: fmt / clippy / test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak-builder \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      # Installs the exact toolchain and components pinned in rust-toolchain.toml.
      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned Python quality tools
        if: runner.os == 'Linux'
        run: python -m pip install --require-hashes -r scripts/requirements-quality.txt

      - name: Lint Python tooling
        if: runner.os == 'Linux'
        run: |
          ruff check scripts
          ruff format --check scripts

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "scripts/install-windows-smoke.ps1")) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Test release artifact contract
        if: runner.os != 'Linux'
        run: python -B -m unittest discover -s scripts/tests -v

      - name: Measure release tooling coverage
        if: runner.os == 'Linux'
        env:
          COVERAGE_FILE: target/release-tooling-coverage
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          coverage run \
            --source=scripts.release_artifact,scripts.performance_gate,scripts.software_gl_probe \
            -m unittest discover -s scripts/tests
          coverage report --precision=2 --show-missing --fail-under=85

      - name: Format
        run: cargo fmt --all -- --check

      # Pedantic clippy with warnings as errors. Do not pass --all-features on the
      # whole workspace: viewr-decode's avif/heic/raw features need system C
      # libraries and are opt-in for local builds (see docs/FORMATS.md).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Documentation tests
        run: cargo test --workspace --doc --locked

      - name: Build workspace binaries
        run: cargo build --workspace --all-targets --locked

      - name: Exercise Windows installer contract
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/install-windows-smoke.ps1 -BinaryDirectory target/debug

      - name: Exercise native Windows accessibility bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/accessibility-smoke.ps1 -Binary target/debug/viewr.exe

      - name: Verify generated Flatpak Cargo sources
        if: runner.os == 'Linux'
        run: |
          python3 scripts/generate-flatpak-cargo-sources.py
          git diff --exit-code -- packaging/flatpak/cargo-sources.json

      - name: Install pinned Flatpak SDK
        if: runner.os == 'Linux'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build and probe Flatpak sandbox
        if: runner.os == 'Linux'
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse \
            target/profile-check/flatpak \
            packaging/flatpak/com.github.blisspixel.viewr.yml
          flatpak-builder --run \
            target/profile-check/flatpak \
            packaging/flatpak/com.github.blisspixel.viewr.yml \
            viewr doctor

      - name: Build and validate macOS App Sandbox bundle
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-sandboxed-app.sh target/debug

      - name: Build and validate Windows AppContainer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-windows-appcontainer.ps1 -BinaryDirectory target/debug

  performance:
    if: github.event_name != 'schedule'
    name: GUI performance budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install virtual-display and software-GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev mesa-vulkan-drivers xauth xvfb

      - name: Set up pinned Rust
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gui-performance

      - name: Build release probe target
        run: cargo build --release --workspace --locked

      - name: Enforce startup, first-pixel, navigation, idle, and memory budgets
        run: python -B scripts/performance_gate.py --binary target/release/viewr

      # A host with no Vulkan driver must still present through OpenGL. wgpu
      # reaches Mesa's GL through EGL, and it can only do so when the display
      # connection reaches the instance, so this proves that wiring end to end.
      - name: Present through the OpenGL backend on a software X session
        env:
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0
          python -B scripts/software_gl_probe.py --binary target/release/viewr

  c-decoder-policy:
    if: github.event_name != 'schedule'
    name: C decoders under default-deny seccomp
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native decoder build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake meson nasm ninja-build pkg-config zlib1g-dev \
            libde265-dev libx265-dev libnuma-dev libheif-dev \
            libheif-plugin-libde265 libheif-plugin-x265

      - name: Set up pinned Rust
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: c-decoder-policy

      - name: Lint feature-gated Linux policies and decoders
        run: |
          cargo clippy -p viewr-seccomp --all-targets --locked -- -D warnings
          cargo clippy -p viewr-decode --features avif,heic --all-targets --locked -- -D warnings

      - name: Prove default-deny policy and production decoder compatibility
        run: |
          cargo test -p viewr-seccomp --locked
          cargo test --release -p viewr-decode \
            --features avif,heic --locked \
            -- --test-threads=1

      - name: Prove libheif 1.23 profile and HEVC VUI behavior
        run: |
          pkg-config --atleast-version=1.0.7 libde265
          cargo test --release -p viewr-decode \
            --features heic-latest-ci --locked \
            -- --test-threads=1

  coverage:
    if: github.event_name != 'schedule'
    name: coverage (>= 85% on logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov

      # Coverage includes the egui/AccessKit UI adapter. Locally patched vendor
      # crates run behavioral tests on every platform above but stay outside the
      # owned-logic percentage, as they did before becoming workspace test members.
      # The remaining exact-path exclusions contain native integration that cannot
      # run honestly here, plus pure-helper debt tracked by the v0.2 roadmap.
      - name: Coverage
        run: >
          cargo llvm-cov --workspace
          --locked
          --exclude jxl-color
          --exclude jxl-render
          --ignore-filename-regex '(^|[/\\])crates[/\\](viewr[/\\]src[/\\](app|gpu|sandbox|worker_limit|error|main)|viewr-decode[/\\]src[/\\]main)\.rs$'
          --fail-under-lines 85
          --lcov --output-path target/lcov.info

  supply-chain:
    name: deny + audit (privacy invariant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny,cargo-audit

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-about@0.9.1

      - name: Verify committed lockfiles
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      # cargo-deny bans remote-service clients and confines generic Linux D-Bus
      # code to AccessKit, in addition to enforcing licenses, advisories, and an
      # exact duplicate-version baseline. NCSA occurs only in the separate fuzz
      # graph; the fuzz run denies every warning and proves that allowance is used.
      - name: cargo-deny
        run: cargo deny --locked check --hide-inclusion-graph -D warnings -A license-not-encountered -A unmatched-skip -A unnecessary-skip

      - name: cargo-deny (fuzz workspace)
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check --hide-inclusion-graph -D warnings

      - name: cargo-audit
        run: cargo audit -D warnings

      - name: cargo-audit (fuzz workspace)
        run: cargo audit --file fuzz/Cargo.lock -D warnings

      - name: Verify third-party license inventory
        run: |
          cargo fetch --locked
          mkdir -p target
          cargo about generate about.hbs \
            --workspace --locked --offline --fail \
            --output-file target/THIRD_PARTY_LICENSES.txt
          python -B scripts/verify_license_inventory.py \
            THIRD_PARTY_LICENSES.txt target/THIRD_PARTY_LICENSES.txt

      - name: privacy-check (packaging + tree)
        run: bash scripts/privacy-check.sh
