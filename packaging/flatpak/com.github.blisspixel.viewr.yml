# Flatpak runtime profile for Phase 7 (network denied by default).
# Release bundling remains separate from this locally inspectable permission profile.
#
# Privacy invariant: do NOT add --share=network. Files open via portals / user
# grants. See docs/SANDBOX_PLAN.md and docs.flatpak.org sandbox-permissions.

app-id: com.github.blisspixel.viewr
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: viewr
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/viewr/cargo
    CARGO_TARGET_DIR: /run/build/viewr/target-flatpak
finish-args:
  # Display / GPU only. No network share.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # File and folder picker portals provide explicit session access. Do not add a
  # broad xdg-pictures filesystem grant.
modules:
  - name: viewr
    buildsystem: simple
    build-commands:
      - cargo --offline build --locked --release --workspace
      - install -Dm755 target-flatpak/release/viewr /app/bin/viewr
      - install -Dm755 target-flatpak/release/viewr-decode /app/bin/viewr-decode
    sources:
      - cargo-sources.json
      - type: dir
        path: ../..
        skip:
          - .agent
          - .git
          - design
          - target
