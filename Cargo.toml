[workspace]
resolver = "3"
members = [
    "crates/viewr",
    "crates/viewr-decode",
    "crates/viewr-protocol",
    "crates/viewr-seccomp",
    "vendor/jxl-color",
    "vendor/jxl-render",
]

[patch.crates-io]
# jxl-color 0.11 permits a single hostile embedded ICC stream to allocate up
# to 256 MiB while JxlDecoder is still initializing. The reviewed local patch
# lowers both encoded and decoded profile limits to viewr's 10 MiB ICC budget.
jxl-color = { path = "vendor/jxl-color" }
# jxl-render 0.12.4 indexes an unused LF-frame level before checking its flag,
# allowing a malformed JXL stream to panic the decoder. The reviewed local
# patch skips that lookup when no LF frame is referenced.
jxl-render = { path = "vendor/jxl-render" }

# Default `cargo test` / `cargo clippy` stay pure-Rust and need no system C libs.
# C-backed worker backends: `cargo build -p viewr-decode --features avif,heic`

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["viewr contributors"]
repository = "https://github.com/blisspixel/viewr"

# Quality bar, enforced by `cargo clippy -- -D warnings` in CI.
# See docs/STANDARDS.md.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Curated allows: pedantic lints that are noise for this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
